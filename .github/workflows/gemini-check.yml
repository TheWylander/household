# One-off: checks receipt reading works through Firebase AI Logic for this project. Removed after it has run. (second try)
name: Gemini check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gemini-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask Gemini to read a made-up receipt
        run: node .github/gemini-check.mjs
