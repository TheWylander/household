# One-off: asks Firebase AI Logic which Gemini setup this project has. Lives on its own branch, which is deleted after it runs.
name: AI Logic check
on:
  push:
    branches: [ai-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask each Gemini route for a one-word reply
        run: node .github/ai-check.mjs
