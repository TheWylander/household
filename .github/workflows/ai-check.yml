# One-off: checks which Sydney Asian grocers publish their specials as public store data. Deleted after it runs.
name: AI Logic check
on:
  push:
    branches: [ai-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look at each store's specials collections
        run: node .github/grocer-check.mjs
