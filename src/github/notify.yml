# Sends the household app's phone notifications: sale days you're keen on (the evening before and the morning of)
# and specials on the watch list. Free on GitHub for public repos. It signs in to Firebase as its own bot user, whose
# login is in two secrets, BOT_EMAIL and BOT_PASSWORD, and does nothing until they're there. The Firestore rules only
# let that user read the sale days, watch list and phones, and note what it sent. No Google Cloud key is needed.
# Run it by hand to send a test to phones that have just turned notifications on. Each run's result shows as a note
# on the run's page.
name: Phone notifications

on:
  schedule:
    - cron: '37 20 * * *'   # about 7:40am in Sydney (6:40am in winter)
    - cron: '7 8 * * *'     # about 7pm in Sydney (6pm in winter)
  workflow_dispatch:
  push:                     # and once whenever its code changes, so a change is tested straight away
    branches: [main]
    paths: ['.github/workflows/notify.yml', '.github/notify/notify.mjs']

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check the bot login is there
        id: key
        env:
          EMAIL: ${{ secrets.BOT_EMAIL }}
          PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: |
          if [ -n "$EMAIL" ] && [ -n "$PASSWORD" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Phone notifications aren't set up yet. Add the BOT_EMAIL and BOT_PASSWORD secrets."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          sparse-checkout: .github   # files at the top come too, including firebase-config.js (the app's public settings)
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Get this week's deals
        if: steps.key.outputs.ok == 'true'
        run: |
          if git fetch --depth 1 origin deals 2>/dev/null; then git show FETCH_HEAD:deals.json > deals.json || echo '{}' > deals.json; else echo '{}' > deals.json; fi
      - name: Install
        if: steps.key.outputs.ok == 'true'
        working-directory: .github/notify
        run: npm init -y > /dev/null && npm install --no-audit --no-fund web-push@3.6.7
      - name: Send
        if: steps.key.outputs.ok == 'true'
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: node .github/notify/notify.mjs deals.json
